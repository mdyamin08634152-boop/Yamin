<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamin ❤️ Kajol</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --teal: #4a9a8a;
    --deep-teal: #2d6b5e;
    --pink: #c0485a;
    --gold: #c49a3a;
    --dark: #0e1a18;
    --text: #e8f5f2;
    --muted: #7ab5a8;
  }
  html, body {
    width: 100%; min-height: 100vh;
    background: var(--dark);
    font-family: "Cormorant Garamond", serif;
    color: var(--text);
    overflow-x: hidden;
  }
  #splash {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(135deg, #0e1a18 0%, #162420 50%, #0e1a18 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-rose { font-size: 4rem; animation: pulse 2s infinite; }
  .splash-title {
    font-family: "Dancing Script", cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--teal); margin: 1rem 0 0.5rem;
    text-align: center; text-shadow: 0 0 30px #4a9a8a60;
  }
  .splash-hint {
    font-size: 1rem; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase;
    animation: blink 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 15% 20%, #2d6b5e33 0%, transparent 55%),
      radial-gradient(ellipse at 85% 80%, #8a253533 0%, transparent 55%),
      linear-gradient(160deg, #0e1a18 0%, #162420 50%, #0e1a18 100%);
  }
  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 6rem;
    gap: 2.5rem;
  }
  .header { text-align: center; }
  .header-sub { font-size: 0.85rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .header-title {
    font-family: "Dancing Script", cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--teal); line-height: 1.1;
    text-shadow: 0 2px 30px #4a9a8a50;
  }
  .header-heart { display: inline-block; animation: pulse 1.5s infinite; color: var(--pink); }
  .header-tagline { font-style: italic; font-size: 1.15rem; color: var(--gold); margin-top: 0.5rem; }
  .divider { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 440px; }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, #4a9a8a50, transparent); }
  .divider-icon { color: var(--teal); font-size: 1.2rem; }
  .photo-card {
    width: 100%; max-width: 480px;
    border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(74,154,138,0.3);
    box-shadow: 0 12px 50px rgba(74,154,138,0.15);
    position: relative;
  }
  .photo-card img { width: 100%; display: block; filter: brightness(0.92) saturate(1.1); }
  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, #0e1a18dd 0%, transparent 55%);
  }
  .photo-caption {
    position: absolute; bottom: 1rem; left: 0; right: 0;
    text-align: center;
    font-family: "Dancing Script", cursive;
    font-size: 1.4rem; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  .timer-card {
    background: rgba(14,26,24,0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(74,154,138,0.25);
    border-radius: 24px; padding: 2.5rem 2rem;
    text-align: center; width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(74,154,138,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .timer-label { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
  .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
  .timer-unit { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .timer-num {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 300;
    color: var(--teal); line-height: 1; min-width: 2ch; text-align: center;
    text-shadow: 0 0 20px #4a9a8a40;
  }
  .timer-unit-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .timer-date { font-style: italic; font-size: 0.95rem; color: var(--gold); margin-top: 0.5rem; }
  .quote-card {
    background: rgba(14,26,24,0.6);
    border-left: 3px solid var(--pink);
    padding: 1.2rem 1.5rem; max-width: 420px; width: 100%;
    border-radius: 0 16px 16px 0;
  }
  .quote-text { font-style: italic; font-size: 1.1rem; color: var(--text); line-height: 1.7; }
  .quote-author { font-size: 0.85rem; color: var(--gold); margin-top: 0.5rem; text-align: right; }
  .floating-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .fheart { position: absolute; bottom: -40px; font-size: 1.2rem; opacity: 0; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    10%{opacity:0.5;} 90%{opacity:0.2;}
    100%{transform:translateY(-110vh) rotate(30deg);opacity:0;}
  }
  footer { position: relative; z-index: 1; text-align: center; padding: 2rem; font-style: italic; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
