<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamin ❤️ Kajol</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #d4737d;
    --deep-rose: #a83a45;
    --blush: #3a1a1f;
    --petal: #2a1015;
    --cream: #1a0810;
    --text: #f0c0c5;
    --gold: #c4956a;
  }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow-x: hidden;
  }

  #splash {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(135deg, #1a0810 0%, #2a1018 50%, #1a080e 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-rose { font-size: 4rem; animation: pulse 2s infinite; }
  .splash-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--rose);
    margin: 1rem 0 0.5rem;
    text-align: center;
    text-shadow: 0 0 30px #a83a4560;
  }
  .splash-hint {
    font-size: 1rem; color: #a06070;
    letter-spacing: 0.15em; text-transform: uppercase;
    animation: blink 2s infinite;
  }

  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 20%, #3a101888 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #2a080e88 0%, transparent 60%),
      linear-gradient(160deg, #1a0810 0%, #220d14 50%, #1a080e 100%);
  }

  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 6rem;
    gap: 2.5rem;
  }

  .header { text-align: center; }
  .header-sub {
    font-size: 0.85rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: #a06070;
    margin-bottom: 0.5rem;
  }
  .header-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--rose);
    line-height: 1.1;
    text-shadow: 0 2px 30px #a83a4550;
  }
  .header-heart { display: inline-block; animation: pulse 1.5s infinite; color: var(--rose); }
  .header-tagline { font-style: italic; font-size: 1.15rem; color: var(--gold); margin-top: 0.5rem; }

  .divider { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 400px; }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, #a83a4560, transparent); }
  .divider-icon { color: var(--rose); font-size: 1.2rem; }

  .timer-card {
    background: rgba(40,10,18,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(168,58,69,0.3);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(168,58,69,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .timer-label { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; color: #a06070; margin-bottom: 1.5rem; }
  .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
  .timer-unit { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .timer-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 300;
    color: var(--rose);
    line-height: 1;
    min-width: 2ch; text-align: center;
    text-shadow: 0 0 20px #a83a4540;
  }
  .timer-unit-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: #a06070; }
  .timer-date { font-style: italic; font-size: 0.95rem; color: var(--gold); margin-top: 0.5rem; }

  .music-card {
    background: rgba(40,10,18,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(168,58,69,0.3);
    border-radius: 20px;
    padding: 1.5rem 2rem;
    width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(168,58,69,0.1);
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
  }
  .music-title { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: var(--rose); }
  .music-controls { display: flex; align-items: center; gap: 1.2rem; }
  .music-btn {
    width: 52px; height: 52px; border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--deep-rose), #c0526a);
    color: white; font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(168,58,69,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .music-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(168,58,69,0.65); }
  .music-waveform { display: flex; align-items: center; gap: 3px; height: 28px; }
  .wave-bar {
    width: 4px; border-radius: 4px;
    background: linear-gradient(to top, var(--deep-rose), var(--rose));
    animation: wave 1s ease-in-out infinite;
    transform-origin: bottom;
  }
  .wave-bar:nth-child(1){ height:10px; animation-delay:0s; }
  .wave-bar:nth-child(2){ height:20px; animation-delay:0.1s; }
  .wave-bar:nth-child(3){ height:14px; animation-delay:0.2s; }
  .wave-bar:nth-child(4){ height:24px; animation-delay:0.15s; }
  .wave-bar:nth-child(5){ height:18px; animation-delay:0.05s; }
  .wave-bar:nth-child(6){ height:10px; animation-delay:0.25s; }
  .wave-bar:nth-child(7){ height:22px; animation-delay:0.1s; }
  .wave-bar.paused { animation-play-state: paused; }
  @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.4)} }
  .music-status { font-size: 0.8rem; color: #a06070; letter-spacing: 0.1em; }

  .quote-card {
    background: rgba(40,10,18,0.5);
    border-left: 3px solid var(--deep-rose);
    padding: 1.2rem 1.5rem;
    max-width: 420px; width: 100%;
    border-radius: 0 16px 16px 0;
  }
  .quote-text { font-style: italic; font-size: 1.1rem; color: var(--text); line-height: 1.7; }
  .quote-author { font-size: 0.85rem; color: var(--gold); margin-top: 0.5rem; text-align: right; }

  .floating-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .fheart {
    position: absolute; bottom: -40px;
    font-size: 1.2rem; opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 2rem;
    font-style: italic; color: #a06070;
    font-size: 0.9rem;
  }
</style>
</head>

  <div class="splash-title">Yamin ❤️ Kajol</div>
  <div class="splash-hint">Touch to enter ✨</div>
</div>

<div class="floating-hearts" id="hearts"></div>
<canvas id="petals"></canvas>
